name: excel-operation
version: 1.2.0
enabled: true
display-name: Excel表格操作
description: |
  生成和管理Excel表格(.xlsx)，支持：生成表格(首行表头+逗号分隔数据)、查看表格内容/指定行、添加/修改/删除行、添加/删除/重命名列、按条件筛选行(等于/大于/小于/包含)、按列排序(升序/降序)、列聚合查询(最大值/最小值/合计/平均值/行数)、清空表格。
  重要：调用本技能时，instruction 必须使用用户的原始指令原文，不要添加"在Excel表格中"等前缀。
executor: excel-operation
capabilities:
  - 生成Excel表格文件
  - 查看表格内容和指定行
  - 添加/修改/删除表格行
  - 添加/删除/重命名表格列
  - 按列升序降序排序
  - 按条件筛选行（等于/大于/小于/包含/不等于）
  - 查询列的最大值/最小值/合计/平均值/行数
  - 清空表格数据
triggers:
  - 表格
  - Excel
  - 生成表格
  - 第几行
  - 查看表格
  - 排序
  - 降序
  - 升序
  - 筛选
  - 找出
  - 查找
  - 加一列
  - 删除列
  - 改成
  - 重命名
  - 清空表格
  - 添加一行
  - 修改第
  - 删除第
  - 多少行
  - 最大值
  - 平均值
  - 合计
timeout-seconds: 30
requires-user-context: true
