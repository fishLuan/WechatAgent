name: weread
version: 1.0.0
enabled: true
display-name: 微信读书助手
description: 查询微信读书书架、阅读统计（周/月/年）、笔记划线、推荐好书（可按主题描述推荐）。数据来自用户微信读书账号（需配置 WEREAD_API_KEY 环境变量，个人数据凭证不入代码）
executor: weread
capabilities:
  - 查看书架
  - 阅读统计查询（本周/本月/今年/总计）
  - 查看笔记划线
  - 推荐好书（支持按主题描述）
triggers:
  - 微信读书
  - 书架
  - 阅读统计
  - 读了多久
  - 读书笔记
  - 划线
  - 推荐书
timeout-seconds: 30
requires-user-context: true
