spring.application.name=ClawBot
spring.main.web-application-type=servlet

# MongoDB-backed, per-user conversation memory
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/clawbot}
clawbot.memory.enabled=${MEMORY_ENABLED:true}
clawbot.memory.namespace=${MEMORY_NAMESPACE:default}
clawbot.memory.recent-turns=15
clawbot.memory.summary-every=10
clawbot.memory.message-dedup-ttl-minutes=30

# B 站动漫、剧集和电影推荐/追更公共配置
# 公共框架完成后保持关闭；采集、推荐、订阅和消息模块集成完成再启用。
clawbot.bilibili.enabled=${BILIBILI_ENABLED:true}
clawbot.bilibili.check-interval-minutes=1
clawbot.bilibili.request-timeout-seconds=15
clawbot.bilibili.max-retries=2
clawbot.bilibili.default-push-time=20:00
clawbot.bilibili.default-recommendation-count=3
clawbot.bilibili.default-minimum-rating=9.0
clawbot.bilibili.movie-push-time=19:30
clawbot.bilibili.movie-recommendation-count=3
clawbot.bilibili.movie-minimum-rating=8.0
clawbot.bilibili.search-result-count=5

# DeepSeek 文本对话
# 密钥默认从环境变量读取，也可通过 -Ddeepseek.api.key=xxx 覆盖。
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
deepseek.url=${DEEPSEEK_URL:https://api.deepseek.com/v1/chat/completions}
deepseek.temperature=0.8
deepseek.max-tokens=4096
deepseek.max-tool-rounds=5
deepseek.connect-timeout-seconds=15
deepseek.request-timeout-seconds=60
deepseek.long-form.enabled=true
deepseek.long-form.min-target-chars=1200
deepseek.long-form.max-target-chars=10000
deepseek.long-form.tolerance-percent=10
deepseek.long-form.max-continuation-rounds=5
deepseek.long-form.max-total-chars=12000

# Agent outer loop (handler orchestration); function-calling uses deepseek.max-tool-rounds
agent.enabled=true
agent.max-planned-tasks=10
agent.max-tasks-per-batch=5
agent.max-parallelism=3
agent.max-outer-rounds=10
agent.guard.max-chat-depth=2
agent.guard.max-tool-calls-per-round=4
agent.guard.max-total-tool-calls=8
agent.guard.max-same-tool-failures=2
agent.guard.max-tool-result-chars=8000
agent.guard.max-total-tool-result-chars=16000
agent.guard.execution-timeout-seconds=90
agent.input.max-attachments=4
agent.input.max-single-bytes=10485760
agent.input.max-total-bytes=20971520
agent.input.max-document-chars=8000
agent.skills.classpath-pattern=classpath*:skills/*/skill.yaml
agent.skills.external-directory=${AGENT_SKILLS_DIRECTORY:./skills}
agent.skills.watch-enabled=true
agent.skills.reload-debounce-millis=500
agent.skills.max-count=64
agent.skills.max-definition-bytes=65536

# 阿里云百炼（图片理解、文生图、语音合成）
dashscope.api.key=${DASHSCOPE_API_KEY:}
dashscope.multimodal.url=https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
dashscope.connect-timeout-seconds=30
dashscope.request-timeout-seconds=120
dashscope.vision.model=qwen-vl-plus
dashscope.vision.default-question=请描述这张图片的内容
dashscope.image.model=wan2.6-t2i
dashscope.image.default-size=1024*1024
dashscope.image.default-count=1
dashscope.image.prompt-extend=true
dashscope.image.watermark=false
dashscope.tts.model=qwen3-tts-flash
dashscope.tts.default-voice=Cherry
dashscope.tts.format=mp3
dashscope.tts.max-text-length=500

# 高德开放平台 Web 服务 Key（天气查询）
amap.weather.api.key=${AMAP_WEATHER_API_KEY:}
amap.weather.url=https://restapi.amap.com/v3/weather/weatherInfo
amap.weather.connect-timeout-seconds=10
amap.weather.request-timeout-seconds=15

# 博查AI开放平台 Web 搜索（国内直连，新用户可免费领取调用资源包）
# 注册：https://open.bochaai.com
bocha.api.key=${BOCHA_API_KEY:}
bocha.web-search.url=https://api.bochaai.com/v1/web-search
bocha.connect-timeout-seconds=30
bocha.request-timeout-seconds=60

# Juhe global exchange-rate conversion
juhe.exchange.api.key=${JUHE_EXCHANGE_API_KEY:}
juhe.exchange.url=https://op.juhe.cn/onebox/exchange/currency
juhe.exchange.version=2
juhe.exchange.connect-timeout-seconds=10
juhe.exchange.request-timeout-seconds=15

# Web page extraction tool
webpage.extract.connect-timeout-seconds=10
webpage.extract.request-timeout-seconds=20
webpage.extract.max-body-chars=6000
webpage.extract.max-response-bytes=2097152
webpage.extract.max-redirects=3
webpage.extract.allowed-ports=80,443

# 天行数据综合新闻
tianapi.api.key=${TIANAPI_API_KEY:***}

# 微信机器人
wechat.bot.enabled=true
wechat.login.timeout-ms=180000
wechat.max-sessions=${WECHAT_MAX_SESSIONS:3}
wechat.dispatch.parallelism=${WECHAT_DISPATCH_PARALLELISM:4}
wechat.dispatch.max-pending-messages=${WECHAT_DISPATCH_MAX_PENDING:100}
wechat.dispatch.shutdown-wait-seconds=${WECHAT_DISPATCH_SHUTDOWN_WAIT_SECONDS:15}
wechat.reply.long-text-threshold=1500
wechat.reply.chunk-size=1400
wechat.reply.pending-expire-minutes=10
wechat.reply.max-pending-chars=20000

# DingTalk custom robot notifications
# Keep the webhook and signing secret in environment variables.
notification.dingtalk.enabled=${DINGTALK_ENABLED:true}
notification.dingtalk.webhook=${DINGTALK_WEBHOOK:}
notification.dingtalk.secret=${DINGTALK_SECRET:}
notification.dingtalk.timeout-seconds=10
notification.dingtalk.error-deduplicate-seconds=60

bot.system.prompt=你是微信任务助手ClawBot。以完成用户任务为首要目标。回答直接、准确、简洁，不寒暄、不卖萌，不使用夸张语气或无意义表情。需要说明操作时只提供必要步骤，任务完成后明确说明结果。\
当请求涉及以下领域时必须调用对应工具获取数据，禁止编造：\
- 天气 → get_weather\
- 汇率换算 → convert_currency\
- 生辰八字、五行、十神、流年运势 → calculate_bazi_fortune\
- 新闻、大事、热点、最近发生的事 → get_news\
- 网页内容提取 → extract_web_page\
- 当前时间、日期、星期、时间戳或时区时间 → get_current_time；每次都必须重新查询，不得复用历史答案\
- 生肖、星座、周岁、虚岁、本命年或生日计算 → calculate_zodiac_info；生肖按农历春节分界\
- 定时/预约（'几点提醒、几点推送、每天几点、明天几点' + 推送/提醒/订阅内容）→ scheduler_manage 创建定时任务，绝不立即执行；'现在/马上推荐' → 才用 bilibili_manage\
- bilibili_manage 的 set_push_time/set_recommend_count/enable_push 等 action 禁止用于响应用户的『几点推送』请求，只能用于修改默认偏好；『几点推送几个电影』一律用 scheduler_manage（task_type=BILIBILI_PUSH）\
一条消息包含多个需求时必须逐项处理；互不依赖的工具请求应在同一轮发出，最终按用户需求顺序回答。\
普通单一问题控制在3句话以内；故事、文章、报告、指定字数和多任务请求按用户要求完整处理。\
不要讨论或编造底层技术、模型架构或API供应商。
