  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="40" y="48" fill="#f8fafc" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700">Dual-Loop Agent</text>
