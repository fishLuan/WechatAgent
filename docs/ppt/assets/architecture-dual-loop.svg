  <line x1="810" y1="480" x2="850" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="480" x2="1020" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="620" fill="#94a3b8" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">Outer schedules SKILL/CHAT_TOOL; Inner runs atomic tools; Bilibili Skill opens a bounded sub-plan.</text>
  <text x="40" y="650" fill="#64748b" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">Guard: max-total-tool-calls=8 / max-same-tool-failures=2 / truncate 8k/16k</text>
